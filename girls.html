<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>טבלאות הישגים בנות - תיכון אחד העם</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#e3e7ef;
  --accent:#7b3fa0; --accent-2:#b0457d; --accent-soft:#f3e9f8; --ok:#1f8a5b; --warn:#c0392b;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;text-align:center;padding:28px 16px 34px}
header img{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:50%;padding:6px;margin-bottom:10px}
header h1{margin:0;font-size:clamp(1.5rem,4vw,2.3rem);font-weight:800}
header p{margin:6px 0 0;opacity:.92}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin:-20px auto 24px}
.tile{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;height:130px;box-shadow:0 4px 14px rgba(0,0,0,.12);border:3px solid transparent;transition:transform .15s,border-color .15s;background:#ddd}
.tile:hover{transform:translateY(-3px)}
.tile.active{border-color:var(--accent)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile img.bg-blur{position:absolute;inset:0;filter:blur(12px) brightness(.85);transform:scale(1.2)}
.tile img.full{position:relative;object-fit:contain;height:calc(100% - 32px)}
.tile .emoji{display:flex;align-items:center;justify-content:center;height:100%;font-size:3.2rem;background:linear-gradient(135deg,#e9d8f4,#f8d9e8)}
.tile span{position:absolute;bottom:0;right:0;left:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;text-align:center;padding:5px 4px;font-size:.95rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
section.test{display:none;background:var(--card);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:28px}
section.test.active{display:block}
h2{margin-top:0;color:var(--accent)}
h3{color:var(--accent-2);margin-bottom:8px}
.calc{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--accent-soft);padding:16px;border-radius:12px}
.calc label{display:flex;flex-direction:column;font-weight:500;gap:4px}
.calc input,.calc select{font:inherit;padding:8px 10px;border:1px solid #cdb6dc;border-radius:8px;min-width:90px;background:#fff}
.calc .time{display:flex;align-items:center;gap:4px;direction:ltr}
.calc .time input{min-width:0;width:70px;text-align:center}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff}
.btn.secondary{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:#fff;color:var(--warn);border:1px solid var(--warn)}
.note{font-size:.9rem;color:var(--muted);width:100%;margin:0}
.result{margin-top:14px;font-size:1.15rem;font-weight:700;min-height:1.6em}
.result .score{font-size:2rem;color:var(--accent)}
.result.bad{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
ul.tips{padding-inline-start:20px;margin:0}
ul.tips li{margin-bottom:4px}
.progress-box{border:1px solid var(--line);border-radius:12px;padding:14px}
.progress-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
canvas{width:100%;height:180px;display:block;border-radius:8px;background:#fafbfe}
table.hist{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
table.hist th,table.hist td{border-bottom:1px solid var(--line);padding:5px;text-align:center}
.plan{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.plan.open{display:block}
.plan-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.plan-controls select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line)}
table.plantbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92rem}
table.plantbl th{background:var(--accent);color:#fff;padding:6px}
table.plantbl td{border:1px solid var(--line);padding:6px;vertical-align:top}
details.full{margin-top:18px}
details.full summary{cursor:pointer;font-weight:700;color:var(--accent)}
table.scoretbl{border-collapse:collapse;margin-top:10px;font-size:.9rem}
table.scoretbl th,table.scoretbl td{border:1px solid var(--line);padding:4px 12px;text-align:center}
table.scoretbl th{background:var(--accent-soft)}
.scorewrap{max-height:340px;overflow:auto;display:inline-block}
footer{text-align:center;color:var(--muted);padding:24px 16px 40px}
footer a{color:var(--accent)}
</style>
</head>

/* ===== בניית הממשק ===== */
const gallery = document.getElementById('gallery'), tabs = document.getElementById('tabs'), sections = document.getElementById('sections');
function store(key, val){ try{ if(val===undefined) return JSON.parse(localStorage.getItem(key)||'[]'); localStorage.setItem(key, JSON.stringify(val)); }catch(e){ return []; } }

TESTS.forEach((t, i) => {
  const tile = document.createElement('div');
  tile.className = 'tile'; tile.dataset.id = t.id;
  tile.innerHTML = (t.img ? (t.fit === 'full' ? `<img class="bg-blur" src="${t.img}" alt=""><img class="full" src="${t.img}" alt="${t.name}">` : `<img src="${t.img}" alt="${t.name}" loading="lazy" style="object-position:${t.pos || 'center'}">`) : `<div class="emoji">${t.emoji}</div>`) + `<span>${t.name}</span>`;
  tile.onclick = () => show(t.id);
  gallery.appendChild(tile);

  const b = document.createElement('button');
  b.textContent = t.name; b.dataset.id = t.id; b.onclick = () => show(t.id);
  tabs.appendChild(b);

  const s = document.createElement('section');
  s.className = 'test'; s.id = 'sec-' + t.id;
  s.innerHTML = `
    <h2>טבלת הישגים - ${t.name}</h2>
    <div class="calc">
      ${t.grade ? `<label>שכבת גיל:<select id="${t.id}-grade"><option value="10">שכבת י'</option><option value="11">שכבת י"א</option><option value="12">שכבת י"ב</option></select></label>` : ''}
      ${t.variant ? `<label>סוג תרגיל:<select id="${t.id}-var"><option value="knee">על הברכיים</option><option value="reg">רגיל</option></select></label>` : ''}
      ${inputHtml(t)}
      <button class="btn" onclick="calc('${t.id}')">חשבי ציון</button>
      ${t.beep ? `<p class="note">יש להזין שלב ומקטע בנפרד, למשל שלב 5 מקטע 3 (5/3).</p>` : ''}
      ${t.plank ? `<p class="note">ציון 100 = החזקה של 84 שניות + 8 עליות וירידות.</p>` : ''}
    </div>
    <div class="result" id="${t.id}-res"></div>
    <div class="grid2">
      <div><h3>טיפים לשיפור ב${t.name}</h3><ul class="tips">${t.tips.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="progress-box">
        <h3>מעקב התקדמות</h3>
        <div class="progress-actions">
          <button class="btn secondary" onclick="addResult('${t.id}')">הוסיפי תוצאה</button>
          <button class="btn danger" onclick="resetData('${t.id}')">אפסי נתונים</button>
          <button class="btn secondary" onclick="togglePlan('${t.id}')">הציגי תוכנית אימונים</button>
        </div>
        <canvas id="${t.id}-chart" width="600" height="220"></canvas>
        <div id="${t.id}-hist"></div>
      </div>
    </div>
    <div class="plan" id="${t.id}-plan">
      <h3>תוכנית אימונים מומלצת</h3>
      <div class="plan-controls">
        <select id="${t.id}-lvl"><option value="0">מתחילה</option><option value="1">מתקדמת</option><option value="2">מתקדמת מאוד</option></select>
        <select id="${t.id}-wk"><option value="4">4 שבועות</option><option value="8">8 שבועות</option><option value="12">12 שבועות</option></select>
        <button class="btn" onclick="makePlan('${t.id}')">צרי תוכנית</button>
      </div>
      <div id="${t.id}-plantbl"></div>
    </div>
    <details class="full"><summary>הצגת טבלת הציונים המלאה</summary><div id="${t.id}-full"></div></details>`;
  sections.appendChild(s);
  if (t.grade) document.getElementById(t.id + '-grade').onchange = document.getElementById(t.id + '-var').onchange = () => fullTable(t);
  fullTable(t);
  drawProgress(t.id);
});

function inputHtml(t){
  if (t.time) return `<label>זמן ריצה (דקות:שניות):<span class="time"><input type="number" id="run-m" min="0" placeholder="דק'"> : <input type="number" id="run-s" min="0" max="59" placeholder="שנ'"></span></label>`;
  if (t.beep) return `<label>שלב:<input type="number" id="beep-l" min="1" max="20"></label><label>מקטע:<input type="number" id="beep-s" min="1" max="15"></label>`;
  if (t.plank) return `<label>זמן החזקה (שניות):<input type="number" id="plank-v" min="0"></label><label>עליות וירידות:<input type="number" id="plank-u" min="0" value="0"></label>`;
  return `<label>מספר ${t.unit}:<input type="number" id="${t.id}-v" min="0"></label>`;
}

function show(id){
  document.querySelectorAll('.tile,.tabs button').forEach(e => e.classList.toggle('active', e.dataset.id === id));
  document.querySelectorAll('section.test').forEach(e => e.classList.toggle('active', e.id === 'sec-' + id));
  document.getElementById('sec-' + id).scrollIntoView({behavior:'smooth', block:'start'});
}

/* ===== חישוב ===== */
function pushTable(){
  const g = document.getElementById('pushups-grade').value, v = document.getElementById('pushups-var').value;
  const col = v === 'knee' ? (g === '10' ? COL.kneeY10 : COL.kneeY11) : (g === '10' ? COL.pushY10 : COL.pushY11);
  return numCol(col);
}
function getValue(id){
  const t = TESTS.find(x => x.id === id);
  if (t.time){ const m = +document.getElementById('run-m').value || 0, s = +document.getElementById('run-s').value || 0; if (!m && !s) return null; return {v:m*60+s, label:`${m}:${String(s).padStart(2,'0')}`}; }
  if (t.beep){ const l = +document.getElementById('beep-l').value, s = +document.getElementById('beep-s').value; if (!l || !s) return null; return {v:l + s/100, l, s, label:`${l}/${s}`}; }
  if (t.plank){ const v = document.getElementById('plank-v').value; if (v === '') return null; const u = +document.getElementById('plank-u').value || 0; return {v:+v, u, label:`${v} שנ'${u ? ' + ' + u + ' עליות' : ''}`}; }
  const v = document.getElementById(id + '-v').value; if (v === '') return null; return {v:+v, label:v};
}
function computeScore(id, val){
  const t = TESTS.find(x => x.id === id);
  if (t.time){ if (val.v <= 0) return null; for (const [max, sc] of RUN) if (val.v <= max) return sc; return 50; }
  if (t.beep){ for (const [l, s, sc] of BEEP) if (val.l > l || (val.l === l && val.s >= s)) return sc; return 'attempt'; }
  if (t.plank){ if (val.v >= 84 && val.u >= 8) return 100; if (val.v >= 84) return 84; if (val.v >= 40) return Math.floor(val.v); return 'below'; }
  const table = t.grade ? pushTable() : t.table;
  const sc = scoreCount(table, val.v);
  return sc === null ? (val.v > 0 || id !== 'rope' ? 30 : null) : sc;
}
function calc(id){
  const res = document.getElementById(id + '-res'), val = getValue(id);
  res.className = 'result';
  if (!val){ res.className = 'result bad'; res.textContent = 'נא להזין תוצאה'; return null; }
  const sc = computeScore(id, val);
  if (sc === null){ res.className = 'result bad'; res.textContent = 'התוצאה לא נמצאת בטבלה'; return null; }
  if (sc === 'below'){ res.className = 'result bad'; res.textContent = 'זמן ההחזקה נמוך מהמינימום בטבלה (40 שניות). כדאי לבדוק מול המורה.'; return null; }
  if (sc === 'attempt'){ res.className = 'result bad'; res.textContent = 'התוצאה נמוכה מהשלב הראשון בטבלה (1/1). כדאי לבדוק מול המורה.'; return null; }
  res.innerHTML = `הציון שלך: <span class="score">${sc}</span>${sc === 30 && id !== 'rope' ? ' (ציון ניסיון)' : ''}`;
  return {score:sc, label:val.label};
}

/* ===== טבלה מלאה ===== */
function fullTable(t){
  let rows;
  if (t.time) rows = ROWS.filter(r => r[COL.run]).map(r => [r[0], r[COL.run].replace('17:01+', '17:01 ומעלה')]);
  else if (t.beep) rows = BEEP.map(([l,s,sc]) => [sc, `${l}/${s}`]);
  else if (t.plank) rows = [[100,'84 שניות + 8 עליות וירידות'],[84,'84 שניות'],[80,'80 שניות'],[60,'60 שניות'],[50,'50 שניות'],[40,'40 שניות']];
  else { const tb = t.grade ? pushTable() : t.table; rows = tb.map(([v,sc]) => [sc, v]); if (t.id !== 'rope') rows.push([30, 'ניסיון']); }
  document.getElementById(t.id + '-full').innerHTML = `<div class="scorewrap"><table class="scoretbl"><tr><th>ציון</th><th>תוצאה</th></tr>${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`;
}

/* ===== מעקב התקדמות ===== */
function addResult(id){
  const r = calc(id); if (!r) return;
  const data = store('girls-' + id); data.push({d:new Date().toLocaleDateString('he-IL'), label:r.label, score:r.score});
  store('girls-' + id, data); drawProgress(id);
}
function resetData(id){ if (confirm('למחוק את כל התוצאות השמורות?')){ store('girls-' + id, []); drawProgress(id); } }
function drawProgress(id){
  const data = store('girls-' + id), c = document.getElementById(id + '-chart'), ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.font = '16px Heebo, Arial'; ctx.fillStyle = '#5d6678'; ctx.textAlign = 'center';
  if (!data.length){ ctx.fillText('עדיין אין תוצאות שמורות', c.width/2, c.height/2); document.getElementById(id + '-hist').innerHTML = ''; return; }
  const pad = 34, w = c.width - pad*2, h = c.height - pad*2, minS = 30, maxS = 100;
  ctx.strokeStyle = '#e3e7ef'; ctx.lineWidth = 1;
  [30, 55, 80, 100].forEach(v => { const y = pad + h - (v-minS)/(maxS-minS)*h; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(pad+w, y); ctx.stroke(); ctx.textAlign = 'right'; ctx.fillText(v, pad-6, y+5); });
  const pts = data.map((p, i) => [pad + (data.length === 1 ? w/2 : i*w/(data.length-1)), pad + h - (p.score-minS)/(maxS-minS)*h]);
  ctx.strokeStyle = '#7b3fa0'; ctx.lineWidth = 3; ctx.beginPath(); pts.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.stroke();
  ctx.fillStyle = '#b0457d'; pts.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); });
  document.getElementById(id + '-hist').innerHTML = `<table class="hist"><tr><th>תאריך</th><th>תוצאה</th><th>ציון</th></tr>${data.map(p => `<tr><td>${p.d}</td><td>${p.label}</td><td>${p.score}</td></tr>`).join('')}</table>`;
}

/* ===== תוכנית אימונים ===== */
function togglePlan(id){ document.getElementById(id + '-plan').classList.toggle('open'); }
const PLAN = {
  pushups:['{n} סטים × {r} שכיבות סמיכה (ברכיים או רגיל לפי היכולת)','פלאנק {p} שניות × 3','ירידות איטיות: {r} חזרות × 2'],
  pull:['תלייה על המתח {p} שניות × 3','{n} סטים × {r} עליות עם גומייה','ירידות איטיות מהמתח: {r} × 2'],
  rope:['{n} סטים של {p} שניות קפיצה רצופה','מנוחה של 45 שניות בין הסטים','קפיצה מהירה ככל האפשר במשך דקה, פעם אחת בסוף'],
  run:['ריצה רציפה בקצב נוח {m} דקות','{n} × 400 מ\' בקצב מבחן, מנוחה 2 דקות','ריצת התאוששות קלה 10 דקות'],
  ladder:['תלייה על מוט {p} שניות × 3','{n} מעברים חלקיים של {r} שלבים','חתירה עם גומייה {r} × 3'],
  beep:['{n} × ריצות הלוך-חזור של 20 מ\' במשך דקה','ריצה רציפה {m} דקות','5 ספרינטים קצרים של 10 מ\' עם שינוי כיוון'],
  plank:['פלאנק מרפקים {p} שניות × {n}','{r} עליות וירידות מפלאנק מרפקים לידיים','פלאנק צד {p} שניות לכל צד'],
};
function makePlan(id){
  const lvl = +document.getElementById(id + '-lvl').value, wk = +document.getElementById(id + '-wk').value;
  let html = '<table class="plantbl"><tr><th>שבוע</th><th>אימונים בשבוע</th><th>תרגילים</th></tr>';
  for (let w = 1; w <= wk; w++){
    const f = (w-1) / Math.max(1, wk-1);
    const n = 2 + lvl + Math.round(f*2), r = Math.round((4 + lvl*3) * (1 + f)), p = Math.round((20 + lvl*15) * (1 + f*0.8)), m = Math.round((12 + lvl*5) * (1 + f*0.6));
    const ex = PLAN[id].map(x => x.replace('{n}', n).replace('{r}', r).replace('{p}', p).replace('{m}', m));
    html += `<tr><td>${w}</td><td>${lvl === 0 ? 2 : 3}</td><td>${ex.join('<br>')}</td></tr>`;
  }
  document.getElementById(id + '-plantbl').innerHTML = html + '</table>';
}

// לחיצה על Enter בכל שדה במחשבון מחשבת ציון (במחשב ובנייד)
TESTS.forEach(t => {
  document.querySelectorAll(`#sec-${t.id} .calc input, #sec-${t.id} .calc select`).forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); calc(t.id); }
    });
  });
});

show('pushups'); window.scrollTo(0, 0);
</script>
